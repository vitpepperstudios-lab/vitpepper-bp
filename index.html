<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Lokum, Afacanlar Sınıfı ve The Pepper Kid: 5 ay, 3 proje.">
<meta property="og:title" content="Vitpepper Studios · Animasyon Business Planı">
<meta property="og:description" content="Lokum, Afacanlar Sınıfı ve The Pepper Kid: 5 ay, 3 proje.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://vitpepperstudios-lab.github.io/vitpepper-bp/">

<title>Animasyon Business Planı</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>
/* Layout: saf siyah sahne. Ana ekran = sonsuz döngülü kapak carousel'i (sürükle/kaydır, ortadaki kapak büyük, yanlar geride; fareyle eğilme + görsel paralaksı; kendiliğinden ilerleme).
   Altında sonsuz isim bandı, ardından sade web düzeninde ortak metinler (plan, kapsam chart'ı, toplam).
   Kapak → %95 pop-up: başlık ve alt gezinme çubuğu kaydırma alanının DIŞINDA sabit, telefonda görünür alana göre boyutlanır.
   Renk: siyah-beyaz-gri nötr skala + tek vurgu kırmızı. */
:root{
  color-scheme:dark;
  --bg:#000000; --s1:#0C0C0C; --s2:#141414; --s3:#1C1C1C; --line:#262626; --line-2:#333333;
  --text:#FFFFFF; --text-2:#B5B5B5; --muted:#7C7C7C;
  --red:#E3262F; --red-fill:#C8102E; --red-soft:rgba(227,38,47,.14);
  --f-title:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;
  --f-display:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --ease:cubic-bezier(.22,.7,.18,1);
  --sw:min(60vw,820px); --sh:clamp(460px,calc(100vh - 230px),780px); --gap:18px;
  --vvh:100vh; --vvt:0px;
}
*{box-sizing:border-box}
html.lock,html.lock body{overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
@supports (overflow-x:clip){ body{overflow-x:clip} }
@supports (height:1svh){ :root{--sh:clamp(460px,calc(100svh - 230px),780px)} }
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:8px}
.wrap{max-width:1200px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
.eb{margin:0;font:700 11.5px/1.3 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
.eb.g{color:var(--muted)}

/* ===== Üst bar ===== */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-left:var(--gl);padding-right:var(--gr);padding-block:16px 6px}
.top img{height:32px;width:auto;display:block}
.top span{font:600 11px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* ===== Sonsuz carousel ===== */
.car{position:relative}
.track{position:relative;display:flex;gap:var(--gap);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;
  padding-block:22px 26px;padding-inline:calc((100vw - var(--sw)) / 2);perspective:1600px;cursor:grab;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.track.drag{scroll-snap-type:none;cursor:grabbing}
.track.drag .slide{pointer-events:none}
.slide{position:relative;flex:0 0 var(--sw);height:var(--sh);scroll-snap-align:center;scroll-snap-stop:always;border:0;padding:0;border-radius:22px;overflow:hidden;background:var(--s2);
  text-align:left;cursor:pointer;isolation:isolate;transform-origin:50% 60%;will-change:transform,filter;transition:box-shadow .5s var(--ease)}
.slide img{position:absolute;top:-3%;left:-9%;width:118%;height:106%;max-width:none;object-fit:cover;z-index:-2;pointer-events:none;user-select:none;-webkit-user-drag:none;
  transform:translate3d(var(--px,0px),var(--py,0px),0) scale(var(--zs,1.02));transition:transform .25s linear}
.slide::after{content:"";position:absolute;inset:auto 0 0;height:46%;z-index:-1;background:linear-gradient(180deg,transparent,rgba(0,0,0,.72))}
.slide.on{box-shadow:0 30px 60px -30px rgba(0,0,0,.9)}
.s-top{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.s-no{font:800 13px var(--f-display);color:#fff}
.s-when{font:700 10.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:#fff;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.6);white-space:nowrap}
.s-bot{position:absolute;left:24px;right:24px;bottom:24px}
.s-kind{font:700 10.5px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:#fff;opacity:.85}
.s-name{display:block;margin-top:6px;font:400 clamp(56px,7.4vw,112px)/.86 var(--f-title);color:var(--red);letter-spacing:.005em}
.s-tag{display:block;margin-top:8px;font:800 12.5px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:#fff}
.s-more{margin-top:16px;display:flex;align-items:center;gap:12px;color:var(--text-2);font-size:13px;opacity:0;transform:translateY(8px);transition:opacity .45s var(--ease),transform .45s var(--ease)}
.slide.on .s-more{opacity:1;transform:none}
.s-go{display:inline-flex;align-items:center;gap:8px;padding:11px 15px;border-radius:999px;background:var(--red-fill);color:#fff;font:700 13px var(--f-body);white-space:nowrap}

.ctl{display:flex;align-items:center;gap:16px;padding-left:var(--gl);padding-right:var(--gr);max-width:calc(var(--sw) + 2*var(--gl));margin:0 auto}
.cnt{flex:none;font:800 13px var(--f-display);font-variant-numeric:tabular-nums;min-width:132px}
.cnt b{color:var(--red);font-weight:800}
.cnt span{display:block;font:500 12.5px var(--f-body);color:var(--muted);margin-top:2px;white-space:nowrap}
.prog{flex:1;height:2px;background:var(--line-2);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--red)}
.nav{flex:none;display:flex;gap:8px}
.nav button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line-2);background:transparent;cursor:pointer;display:grid;place-items:center;transition:background .25s,border-color .25s}
.nav button:hover{background:var(--red-fill);border-color:var(--red-fill)}
.nav svg{width:18px;height:18px}

/* Sonsuz isim bandı */
.marq{margin-top:46px;border-block:1px solid var(--line);overflow:hidden;padding-block:14px;user-select:none}
.mq-in{display:flex;width:max-content;animation:mq 34s linear infinite}
.mq-in>span{flex:none;display:flex;align-items:center;gap:28px;padding-right:28px;font:400 clamp(40px,6vw,72px)/1 var(--f-title);letter-spacing:.02em;white-space:nowrap}
.mq-in .o{color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.42)}
.mq-in .f{color:var(--red)}
.mq-in .dot{width:10px;height:10px;border-radius:50%;background:var(--line-2);flex:none}
@keyframes mq{to{transform:translateX(-50%)}}

/* ===== Ortak metinler ===== */
.row2{display:grid;grid-template-columns:180px minmax(0,1fr);gap:12px 40px;padding-block:88px 0}
.row2>.lab{margin:0;padding-top:5px;font:700 11.5px/1.3 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--red)}
.row2>div{min-width:0}
.row2 h2{margin:0;font:700 20px/1.35 var(--f-display);letter-spacing:-.01em}
.row2 p.sub{margin:10px 0 0;max-width:64ch;font-size:15.5px;line-height:1.7;color:var(--text-2)}
.seq{margin:28px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.seq li{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.seq .st{font:800 13px var(--f-display);color:var(--red);font-variant-numeric:tabular-nums}
.seq .th{display:flex}
.seq .th img{width:40px;height:40px;border-radius:10px;object-fit:cover;border:2px solid var(--bg)}
.seq .th img+img{margin-left:-12px}
.seq .nm{font:700 15.5px/1.3 var(--f-display)}
.seq .nm small{display:block;margin-top:2px;font:400 13.5px var(--f-body);color:var(--muted)}
.seq .when{text-align:right;font:600 13px var(--f-body);color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.seq .when b{display:block;font:700 15px var(--f-display);color:var(--text)}
.cov-wrap{margin-top:24px;overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--s1)}
table.cov{width:100%;min-width:350px;border-collapse:collapse;font-size:13px;table-layout:fixed}
.cov col.lab{width:31%}
.cov thead th{padding:18px 6px 16px;vertical-align:bottom;text-align:center;border-bottom:1px solid var(--line)}
.cov thead th:first-child{text-align:left;padding-left:14px}
.cov thead button{background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.cov thead img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--line-2);transition:transform .3s var(--ease)}
.cov thead button:hover img{transform:scale(1.08)}
.cov thead .nm{font:400 19px/.95 var(--f-title);color:var(--red);letter-spacing:.02em}
.cov tbody th{text-align:left;font:600 11px/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 6px 12px 14px}
.cov td{text-align:center;padding:12px 6px;line-height:1.35}
.cov tbody tr+tr th,.cov tbody tr+tr td{border-top:1px solid var(--line)}
.cov tr.grp th{padding-top:22px;padding-bottom:8px;color:var(--text);font-weight:700;letter-spacing:.16em;font-size:10.5px}
.cov tr.grp+tr th,.cov tr.grp+tr td{border-top:0}
.ck{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--red-fill)}
.ck svg{width:13px;height:13px}
.no-ck{display:inline-block;width:14px;height:2px;border-radius:2px;background:var(--line-2);vertical-align:middle}
.cov td b{font-weight:700;font-variant-numeric:tabular-nums}
.cov td small{display:block;color:var(--muted);font-size:11.5px}
.total{margin-top:14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tbox{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:20px}
.tbox .k{font:700 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tbox .v{margin-top:8px;font:700 24px/1.1 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbox .s{margin-top:8px;color:var(--text-2);font-size:13px}
.foot{padding-block:96px 24px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.foot img{height:28px;width:auto;display:block;margin-bottom:10px}
.film{height:38px;display:flex;align-items:center;gap:12px;overflow:hidden;background:var(--s2);padding-left:var(--gl);padding-right:var(--gr)}
.film span{flex:none;width:22px;height:15px;border-radius:4px;background:var(--bg)}

/* ===== Pop-up ===== */
.pop{position:fixed;z-index:100;margin:0;padding:0;display:flex;
  left:2.5vw;width:95vw;top:calc(var(--vvt,0px) + var(--vvh,100dvh) * .025);height:calc(var(--vvh,100dvh) * .95);
  border:1px solid var(--line-2);border-radius:20px;background:var(--bg);color:var(--text);overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.9);
  flex-direction:column}
.pop:not([hidden]){animation:popin .45s var(--ease)}
.pop-bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99;background:rgba(0,0,0,.78)}
@keyframes popin{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
.pop-hd{flex:none;position:relative;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 20px;border-bottom:1px solid var(--line);background:var(--bg);touch-action:none}
.pop-hd .grab{display:none;position:absolute;left:50%;top:6px;width:40px;height:4px;border-radius:4px;background:var(--line-2);transform:translateX(-50%)}
.pop-hd .ttl{min-width:0;flex:1;display:flex;align-items:baseline;gap:12px}
.pop-hd .ttl b{font:400 26px/1 var(--f-title);color:var(--red);letter-spacing:.02em;white-space:nowrap}
.pop-hd .ttl span{font:600 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xbtn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:var(--s2);color:#fff;font-size:24px;line-height:1;cursor:pointer;transition:background .2s,border-color .2s}
.xbtn:hover{background:var(--red-fill);border-color:var(--red-fill)}
.pop-sc{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pop-sc:focus{outline:none}
.pop-ft{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.pop-ft button{height:44px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-width:0}
.pop-ft .pv,.pop-ft .nx{background:transparent;border:1px solid var(--line-2);padding:0 14px;font:600 13px var(--f-body);color:var(--text-2);max-width:100%}
.pop-ft .pv span,.pop-ft .nx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-ft .pv{justify-self:start}
.pop-ft .nx{justify-self:end}
.pop-ft .pv:hover,.pop-ft .nx:hover{border-color:var(--text);color:var(--text)}
.pop-ft .cl{background:var(--red-fill);border:0;padding:0 20px;font:700 14px var(--f-body);color:#fff}
.pop-ft svg{width:16px;height:16px;flex:none}
.pop-ft .gen{display:none}

.ph-hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:min(70dvh,680px)}
.ph-img{position:relative;overflow:hidden;background:var(--s2)}
.ph-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 18s ease-out both}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1)}}
.ph-txt{padding:48px 48px 40px;display:flex;flex-direction:column;justify-content:flex-end}
.ph-txt .kind{font:700 11.5px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--text-2)}
.ph-txt h2{margin:8px 0 0;font:400 clamp(52px,5.5vw,84px)/.88 var(--f-title);color:var(--red);letter-spacing:.01em}
.ph-txt .tag{margin:12px 0 0;font:800 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.ph-txt .syn{margin-top:22px}
.ph-txt .syn p{margin:0 0 12px;color:var(--text-2);font-size:15.5px;line-height:1.7;max-width:58ch}
.stats{margin-top:20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stats div{background:var(--s1);padding:13px 15px}
.stats .k{font:700 10.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stats .v{margin-top:3px;font:700 15px/1.3 var(--f-display);font-variant-numeric:tabular-nums}
.pin{padding:0 48px 48px}
.blk{margin-top:64px}
.blk h3{margin:8px 0 18px;font:700 20px/1.3 var(--f-display);letter-spacing:-.01em}
.chars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;text-align:center;margin-bottom:14px}
.chars b{display:block;font:800 15px var(--f-display)}
.chars span{display:block;font-size:11px;color:var(--muted);line-height:1.35}
.lineup{width:100%;max-width:820px;display:block;border-radius:14px}

/* Karakter sahnesi — tek spot ışığı */
.stagebox{position:relative;overflow:hidden;border-radius:18px;background:var(--s1);border:1px solid var(--line);isolation:isolate}
.cast,.roles{display:grid;grid-template-columns:231fr 166fr 184fr 166fr 198fr;max-width:720px;margin:0 auto;padding-inline:14px}
.cast{position:relative;z-index:2;align-items:end;padding-top:64px;padding-bottom:14px}
.actor{display:block;border:0;padding:0;background:none;cursor:pointer;transition:filter .6s var(--ease),transform .6s var(--ease);-webkit-tap-highlight-color:transparent}
.actor img{display:block;width:100%;height:auto;pointer-events:none;user-select:none}
.stagebox .actor{filter:brightness(.62) saturate(.82)}
.stagebox .actor.on{filter:brightness(1.06) saturate(1.04);transform:translateY(-3px)}
.beam,.pool,.lamp{position:absolute;pointer-events:none;transform:translateX(-50%);transition:left .65s var(--ease),width .65s var(--ease)}
.beam{top:0;bottom:24px;z-index:3;mix-blend-mode:screen;filter:blur(6px);
  background:linear-gradient(180deg,rgba(255,247,236,.19),rgba(255,247,236,.07) 60%,rgba(255,247,236,.03));
  clip-path:polygon(43% 0,57% 0,100% 100%,0 100%)}
.lamp{top:-14px;width:84px;height:30px;z-index:3;border-radius:50%;background:radial-gradient(closest-side,rgba(255,250,242,.55),transparent)}
.pool{bottom:4px;height:40px;z-index:1;border-radius:50%;background:radial-gradient(closest-side,rgba(255,247,236,.22),transparent)}
.floor{position:absolute;left:0;right:0;bottom:24px;height:1px;z-index:0;background:var(--line)}
.roles{position:relative;z-index:2;padding-top:4px;padding-bottom:18px}
.role{background:none;border:0;cursor:pointer;text-align:center;padding:10px 2px 4px;min-width:0;color:var(--muted)}
.role b{display:block;font:800 15px/1.2 var(--f-display);color:var(--text-2);transition:color .3s}
.role span{display:block;margin-top:2px;font-size:11px;line-height:1.3}
.role::after{content:"";display:block;width:18px;height:2px;margin:8px auto 0;border-radius:2px;background:transparent;transition:background .3s}
.role.on b{color:#fff}
.role.on::after{background:var(--red)}
.role:hover b{color:#fff}
.stage-hint{margin:0 0 12px;font-size:13px;color:var(--muted)}

/* Takvim — referans düzen, siyah sürüm */
.cal{background:var(--s1);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.cal-in{padding:30px 28px 6px}
.cal-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cal-hd img{height:30px;width:auto;flex:none}
.cal h4{margin:10px 0 0;font:800 clamp(26px,3.4vw,36px)/1.02 var(--f-display);letter-spacing:-.03em}
.cal .rng{margin:8px 0 0;font:500 15.5px var(--f-display);color:var(--text-2);font-variant-numeric:tabular-nums}
.cal-sc{margin:30px -28px 0;padding:0 28px 30px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:28px}
.cal-grid{min-width:calc(7*142px + 6*10px);display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:10px}
.phs{padding-bottom:10px;border-bottom:1.5px solid var(--line-2);font:500 13px var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.phs.on{color:var(--red);font-weight:800;border-bottom:3px solid var(--red);padding-bottom:8.5px}
.rail{grid-column:1/-1;position:relative;height:30px;margin-top:6px}
.rail::before{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;background:var(--line-2)}
.rail i{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:var(--red);transform:translate(-50%,-50%)}
.cc{scroll-snap-align:start;margin-top:12px;background:var(--s2);border:1px solid var(--line-2);border-radius:14px;padding:16px 14px 18px;min-height:206px;display:flex;flex-direction:column}
.cc .n{font:700 17px var(--f-display);color:var(--red);font-variant-numeric:tabular-nums}
.cc .d{margin-top:10px;font:800 54px/1 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.cc .w{margin-top:6px;font:400 14.5px var(--f-display);color:var(--muted)}
.cc .r{height:1px;background:var(--line-2);margin:12px 0}
.cc .t{font:800 15.5px/1.2 var(--f-display);text-wrap:balance}
.cc.on{background:var(--red-fill);border-color:var(--red-fill);box-shadow:0 0 0 6px var(--red-soft),0 18px 50px -10px rgba(200,16,46,.6)}
.cc.on .n,.cc.on .w{color:rgba(255,255,255,.82)}
.cc.on .r{background:rgba(255,255,255,.3)}
.swipe{display:none;margin:0 0 12px;font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cal-film{height:32px;display:flex;gap:12px;align-items:center;padding:0 16px;background:var(--s3);overflow:hidden}
.cal-film span{flex:none;width:20px;height:13px;border-radius:4px;background:var(--bg)}

.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
.ms{list-style:none;margin:0;padding:0;position:relative}
.ms::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:1.5px;background:var(--line-2)}
.ms li{position:relative;padding:0 0 24px 34px}
.ms li:last-child{padding-bottom:0}
.ms li::before{content:"";position:absolute;left:2px;top:6px;width:11px;height:11px;transform:rotate(45deg);background:var(--bg);border:2px solid var(--text);border-radius:2px}
.ms li.pay::before{background:var(--red);border-color:var(--red)}
.ms .dt{font:700 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.ms .lb{margin-top:3px;font:700 17px/1.3 var(--f-display)}
.ms .nt{margin-top:2px;color:var(--text-2);font-size:14px}
.ms .amt{display:inline-block;margin-top:8px;padding:5px 11px;border-radius:999px;border:1px solid var(--red);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.bud{display:grid;gap:12px}
.bud .k{font:700 10.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bud .big{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:22px 22px 20px}
.bud .big .v{margin-top:8px;font:700 clamp(28px,3.4vw,36px)/1.05 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.bud .big .v small{font-size:.42em;letter-spacing:0;font-weight:700;color:var(--muted);margin-left:8px}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cardd{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px}
.cardd .v{margin-top:6px;font:700 20px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.cardd .s{margin-top:4px;color:var(--text-2);font-size:13px}
.rev{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;gap:18px;align-items:center}
.rev .pct{flex:none;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--red) var(--p),var(--s3) 0)}
.rev .pct::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--s1)}
.rev .pct span{position:relative;font:800 20px var(--f-display)}
.rev .v{margin-top:4px;font:700 16px/1.35 var(--f-display)}
.rev .s{margin-top:4px;color:var(--text-2);font-size:13.5px}


/* ===== İkonlu kısa maddeler ===== */
.ic{width:20px;height:20px;flex:none;display:block}
.pts{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:10px}
.pts li{display:flex;align-items:center;gap:14px}
.pts .bub{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--red-soft);color:var(--red)}
.pts .tx{font-size:15.5px;line-height:1.35}
.pts .tx b{display:block;font:700 10.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.chips{margin-top:20px;display:flex;flex-wrap:wrap;gap:8px}
.chips span{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line-2);font:600 13.5px var(--f-body)}
.chips .ic{width:16px;height:16px;color:var(--text-2)}
.ms2{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ms2 li{display:flex;align-items:center;gap:14px;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--s1)}
.ms2 .bub{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s3)}
.ms2 li.pay .bub{background:var(--red-fill)}
.ms2 .dt{display:block;font:700 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.ms2 .lb{display:block;font:700 15.5px/1.3 var(--f-display)}
.ms2 .amt{margin-left:auto;flex:none;font:700 13.5px var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.money{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:20px}
.money .k{font:700 10.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.money .v{margin-top:6px;font:700 32px/1.05 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.money .v small{font-size:14px;color:var(--muted);margin-left:6px;letter-spacing:0}
.halves{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.halves div{border-radius:12px;padding:12px 14px;font-size:12.5px}
.halves b{display:block;margin-bottom:2px;font:700 17px var(--f-display);font-variant-numeric:tabular-nums}
.halves .h1{background:var(--red-fill);color:rgba(255,255,255,.85)}
.halves .h1 b{color:#fff}
.halves .h2{background:var(--s3);color:var(--text-2)}
.halves .h2 b{color:var(--text)}
.rev2{margin-top:12px;display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--s1)}
.rev2 .pct{flex:none;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--red) var(--p),var(--s3) 0)}
.rev2 .pct::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--s1)}
.rev2 .pct span{position:relative;font:800 18px var(--f-display)}
.rev2 .t{font:700 16px/1.3 var(--f-display)}
.rev2 .s{margin-top:3px;font-size:13.5px;color:var(--text-2)}
/* 9 aylık şerit */
.strip{margin-top:22px;overflow-x:auto}
.strip-in{min-width:330px}
.mos{display:flex;gap:4px}
.lanes{position:relative;height:162px;margin-top:8px}
.lanes .b9{position:absolute;height:50px;margin:0}
.mo{min-width:0;text-align:center;font:700 12.5px var(--f-body);color:var(--text-2);padding-bottom:8px;border-bottom:1px solid var(--line)}
.mo small{display:block;font:500 10.5px var(--f-body);color:var(--muted);height:14px}
.b9{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;border:0;cursor:pointer;text-align:left;min-width:0;transition:transform .25s var(--ease)}
.b9:hover{filter:brightness(1.12)}
.b9 img{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none}
.b9 .tx{min-width:0}
.b9 b{display:block;font:700 14px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b9 small{display:block;font-size:12px;opacity:.85}
.b9.l{background:var(--red-fill);color:#fff}
.b9.s{background:var(--s3);color:var(--text)}
@media (max-width:820px){
  .pts .tx{font-size:15px}
  .money .v{font-size:28px}
  .b9{padding:6px;gap:8px}
  .b9 img{width:32px;height:32px}
  .lanes .b9 img{display:none}
  .lanes .b9{padding:6px 10px}
}


/* Haklar ve gelir (sade) */
.rights{display:grid;gap:10px}
.rt{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--s1)}
.rt .bub{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s3)}
.rt .k,.split2 .k{display:block;font:700 10.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rt b{display:block;margin-top:2px;font:700 17px/1.25 var(--f-display)}
.split2{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--s1)}
.split2 .bar{margin-top:10px;display:flex;gap:4px;height:66px}
.split2 .bar span{display:flex;flex-direction:column;justify-content:center;padding:0 14px;border-radius:10px;font:600 12.5px var(--f-body);min-width:0;white-space:nowrap;overflow:hidden}
.split2 .bar b{font:800 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.split2 .tt{flex:75 1 0;background:var(--s3);color:var(--text-2)}
.split2 .tt b{color:var(--text)}
.split2 .vp{flex:25 1 0;min-width:104px;background:var(--red-fill);color:rgba(255,255,255,.88)}
.split2 .vp b{color:#fff}
.split2 .s{margin-top:10px;font-size:13px;color:var(--text-2)}
.blk h3.h3b{margin-top:30px}

/* ===== Telefon ===== */
@media (max-width:820px){
  :root{--sw:84vw;--sh:min(68vh,600px);--gap:12px}
  .track{cursor:auto;padding-block:16px 20px}
  .s-name{font-size:clamp(58px,17vw,86px)}
  .s-bot{left:20px;right:20px;bottom:20px}
  .ctl{gap:12px}
  .cnt{min-width:0}
  .nav button{width:42px;height:42px}
  .marq{margin-top:36px}
  .row2{grid-template-columns:1fr;padding-block:64px 0}
  .seq li{grid-template-columns:auto auto minmax(0,1fr);row-gap:4px}
  .seq .when{grid-column:3;text-align:left}
  .seq .when b{display:inline;margin-right:6px}
  .total{grid-template-columns:1fr}
  /* Alttan açılan panel: üstte uygulama-içi tarayıcı barına pay bırakılır */
  .pop{top:calc(var(--vvt,0px) + var(--pad-top));height:calc(var(--vvh,100dvh) - var(--pad-top) - 8px);border-radius:20px}
  :root{--pad-top:max(60px,calc(env(safe-area-inset-top,0px) + 44px))}
  .pop-hd{padding:16px 8px 8px 18px}
  .pop-hd .grab{display:block}
  .pop-hd .ttl{flex-direction:column;gap:2px}
  .pop-hd .ttl b{font-size:24px}
  .ph-hero{grid-template-columns:1fr;min-height:0}
  .ph-img{height:44vh;min-height:280px}
  .ph-txt{padding:22px 20px 8px}
  .ph-txt h2{font-size:clamp(52px,15vw,72px)}
  .pin{padding:0 20px 32px}
  .blk{margin-top:48px}
  .cols{grid-template-columns:1fr;gap:0}
  .cal-in{padding:24px 18px 4px}
  .cal-sc{margin:26px -18px 0;padding:0 18px 24px;scroll-padding-left:18px}
  .swipe{display:block}
  .chars span{font-size:10px}
  .chars b{font-size:13px}
  .pop-ft .pv .nm,.pop-ft .nx .nm{display:none}
  .pop-ft .gen{display:inline}
}
@supports (height:1svh){ @media (max-width:820px){ :root{--sh:min(68svh,600px)} } }
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

function fitViewport(){

// ---------- Sonsuz carousel ----------
const SETS = 3, N = P.length;
const track = $("track");
track.innerHTML = Array.from({length: SETS * N}, (_, k) => {
  const p = P[k % N], i = k % N;
  return `<button class="slide${k === N ? " on" : ""}" data-k="${k}" data-id="${p.id}" aria-label="${p.name}: proje detaylarını aç" tabindex="${k === N ? 0 : -1}">
    <img src="${IMG[p.img]}" alt="" draggable="false" style="object-position:${p.pos}">
    <span class="s-top"><span class="s-no">0${i+1} / 0${N}</span><span class="s-when">${shortMY(p.start)} – ${shortMY(p.end)}</span></span>
    <span class="s-bot">
      <span class="s-kind">${p.kind}</span>
      <span class="s-name"${L(p)}>${p.name}</span>
      <span class="s-tag">${p.tag}</span>
      <span class="s-more"><span class="s-go">Detayları aç <span aria-hidden="true">→</span></span><span>${p.length} · ${p.months} ay</span></span>
    </span>
  </button>`;
}).join("");
const slides = [...track.children];
const tilt = new Map(); // k -> {x,y}

const centerOf = k => { const el = slides[k]; return el.offsetLeft + el.offsetWidth / 2 - track.clientWidth / 2; };
function currentK(){
  let best = 0, bd = Infinity;
  for (let k = 0; k < slides.length; k++){ const d = Math.abs(centerOf(k) - track.scrollLeft); if (d < bd){ bd = d; best = k; } }
  return best;
}
let activeK = -1;
function paint(){
  if (!track.clientWidth || !slides[0].offsetWidth) return;
  const mid = track.scrollLeft + track.clientWidth / 2;
  const step = slides[0].offsetWidth + parseFloat(getComputedStyle(track).columnGap || 0);
  const k0 = currentK();
  slides.forEach((el, k) => {
    const c = el.offsetLeft + el.offsetWidth / 2;
    const d = Math.max(-1.6, Math.min(1.6, (c - mid) / step));
    const a = Math.min(Math.abs(d), 1);
    const t = tilt.get(k) || {x:0, y:0};
    const ry = (reduce.matches ? 0 : -d * 7) + t.x * 6;
    const rx = -t.y * 4;
    el.style.transform = `scale(${(1 - a * .09).toFixed(4)}) rotateY(${ry.toFixed(2)}deg) rotateX(${rx.toFixed(2)}deg)`;
    el.style.filter = `brightness(${(1 - a * .38).toFixed(3)}) saturate(${(1 - a * .25).toFixed(3)})`;
    el.style.setProperty("--px", (reduce.matches ? 0 : (-d * 60 - t.x * 18)).toFixed(1) + "px");
    el.style.setProperty("--py", (-t.y * 12).toFixed(1) + "px");
    el.style.setProperty("--zs", t.x || t.y ? "1.06" : "1.02");
  });
  if (k0 !== activeK){
    activeK = k0;
    slides.forEach((el, k) => { el.classList.toggle("on", k === k0); el.tabIndex = k === k0 ? 0 : -1; });
    const i = k0 % N;
    $("cntNo").textContent = "0" + (i + 1);
    $("cntName").textContent = P[i].name;
  }
}
let raf = 0;
const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(); }); };

function jumpTo(k){ // anında, animasyonsuz
  track.style.scrollSnapType = "none";
  track.scrollLeft = centerOf(k);
  void track.offsetWidth;
  track.style.scrollSnapType = "";
}
function normalize(){
  const k = currentK();
  if (k < N || k >= 2 * N){
    const j = k < N ? k + N : k - N;
    const off = track.scrollLeft - centerOf(k);
    track.style.scrollSnapType = "none";
    track.scrollLeft = centerOf(j) + off;
    void track.offsetWidth;
    track.style.scrollSnapType = "";
    schedule();
  }
}
function goTo(k){
  if (k < 0 || k >= slides.length){ normalize(); k = Math.max(0, Math.min(slides.length - 1, k)); }
  track.scrollTo({ left: centerOf(k), behavior: reduce.matches ? "auto" : "smooth" });
}
function step(dir){ normalize(); goTo(currentK() + dir); }

let settleT = 0;
track.addEventListener("scroll", () => {
  schedule();
  clearTimeout(settleT);
  settleT = setTimeout(() => { if (!dragging) normalize(); }, 140);
}, { passive: true });
if ("onscrollend" in window) track.addEventListener("scrollend", () => { if (!dragging) normalize(); });

// Fareyle sürükleme (dokunmatikte yerel kaydırma kullanılır)
let dragging = false, moved = false, sx = 0, sl = 0, vx = 0, lastX = 0, lastT = 0;
track.addEventListener("pointerdown", e => {
  if (e.pointerType !== "mouse" || e.button !== 0) return;
  dragging = true; moved = false; sx = lastX = e.clientX; sl = track.scrollLeft; lastT = performance.now(); vx = 0;
  pause(8000);
});
window.addEventListener("pointermove", e => {
  if (!dragging) return;
  const dx = e.clientX - sx;
  if (!moved && Math.abs(dx) > 6){ moved = true; track.classList.add("drag"); }
  if (moved){
    track.scrollLeft = sl - dx;
    const now = performance.now(); vx = (e.clientX - lastX) / Math.max(1, now - lastT); lastX = e.clientX; lastT = now;
  }
});
window.addEventListener("pointerup", () => {
  if (!dragging) return;
  dragging = false;
  if (moved){
    track.classList.remove("drag");
    normalize();
    const k = currentK() + (vx < -0.5 ? 1 : vx > 0.5 ? -1 : 0);
    goTo(k);
  }
});
track.addEventListener("click", e => {
  if (moved){ e.preventDefault(); e.stopPropagation(); moved = false; return; }
  const s = e.target.closest(".slide"); if (!s) return;
  const k = +s.dataset.k;
  if (k !== currentK()){ goTo(k); pause(8000); return; }
  openPop(s.dataset.id);
}, true);

// Fareyle eğilme + paralaks (ortadaki kapak)
track.addEventListener("pointermove", e => {
  if (!finePtr.matches || reduce.matches || dragging) return;
  const s = e.target.closest(".slide"); if (!s) return;
  const r = s.getBoundingClientRect();
  tilt.clear();
  tilt.set(+s.dataset.k, { x: (e.clientX - r.left) / r.width - .5, y: (e.clientY - r.top) / r.height - .5 });
  schedule();
});
track.addEventListener("pointerleave", () => { tilt.clear(); schedule(); });

// Klavye
track.addEventListener("keydown", e => {
  if (e.key === "ArrowRight"){ e.preventDefault(); step(1); pause(8000); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); step(-1); pause(8000); }
});
$("prev").addEventListener("click", () => { step(-1); pause(8000); });
$("next").addEventListener("click", () => { step(1); pause(8000); });

// Kendiliğinden ilerleme
const AUTO_MS = 6000;
let prog = 0, pausedUntil = 0, hover = false, lastTick = performance.now();
function pause(ms){ pausedUntil = performance.now() + ms; }
track.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") hover = true; });
track.addEventListener("pointerleave", () => { hover = false; });
track.addEventListener("touchstart", () => pause(9000), { passive: true });
function tick(now){
  const dt = now - lastTick; lastTick = now;
  const stop = reduce.matches || hover || dragging || document.hidden || popOpen() || now < pausedUntil;
  if (!stop){
    prog += dt / AUTO_MS;
    if (prog >= 1){ prog = 0; step(1); }
  } else if (now < pausedUntil || popOpen()) { prog = 0; }
  $("prog").style.width = (prog * 100).toFixed(2) + "%";
  requestAnimationFrame(tick);
}

let touched = false;
["pointerdown","touchstart","wheel","keydown"].forEach(ev => track.addEventListener(ev, () => { touched = true; }, { passive: true }));
function initCarousel(){ if (!track.clientWidth) return; jumpTo(touched ? currentK() : N); paint(); }
window.addEventListener("load", initCarousel);
setTimeout(initCarousel, 400);
document.addEventListener("visibilitychange", () => { if (!document.hidden) initCarousel(); });
if ("ResizeObserver" in window) new ResizeObserver(() => initCarousel()).observe(track);
window.addEventListener("resize", () => { if (!track.clientWidth) return; const k = currentK(); jumpTo(k); paint(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { const k = currentK(); jumpTo(k); paint(); });

const CAST = [
  { id:"kaan",  n:"Kaan",  t:"Pratik · Uyanık" },
  { id:"ada",   n:"Ada",   t:"Analitik · Odaklı" },
  { id:"memo",  n:"Memo",  t:"Cesur · Kaotik" },
  { id:"batu",  n:"Batu",  t:"Sessiz · Gözlemci" },
  { id:"derin", n:"Derin", t:"Sosyal · Sezgisel" }
];
let curSpot = 0;
function spot(i){
  const box = $("stagebox"); if (!box) return;
  curSpot = i;
  const actors = box.querySelectorAll(".actor"), roles = box.querySelectorAll(".role");
  actors.forEach((a,k) => a.classList.toggle("on", k === i));
  roles.forEach((r,k) => { r.classList.toggle("on", k === i); r.setAttribute("aria-pressed", k === i); });
  const a = actors[i], cast = $("cast");
  const cx = cast.offsetLeft + a.offsetLeft + a.offsetWidth / 2; // dönüşümlerden etkilenmez
  const floorY = cast.offsetTop + cast.offsetHeight - parseFloat(getComputedStyle(cast).paddingBottom);
  $("beam").style.left = cx + "px"; $("beam").style.width = Math.max(a.offsetWidth * 1.9, 110) + "px";
  $("beam").style.bottom = (box.offsetHeight - floorY - 6) + "px";
  $("lamp").style.left = cx + "px";
  $("pool").style.left = cx + "px"; $("pool").style.width = (a.offsetWidth * 1.4) + "px";
  $("pool").style.top = (floorY - 20) + "px"; $("pool").style.bottom = "auto";
  box.querySelector(".floor").style.top = floorY + "px"; box.querySelector(".floor").style.bottom = "auto";
}
document.addEventListener("click", e => {
  const t = e.target.closest("#stagebox [data-c]"); if (t) spot(+t.dataset.c);
});
window.addEventListener("resize", () => { if ($("stagebox")) spot(curSpot); });
let lastFocus = null;
const popOpen = () => !$("pop").hidden;
function closePop(){
  if (!popOpen()) return;
  $("pop").hidden = true; $("popBg").hidden = true;
  document.documentElement.classList.remove("lock");
  pause(4000);
  if (lastFocus && lastFocus.focus) { try { lastFocus.focus({ preventScroll: true }); } catch (e) {} }
}
$("popBg").addEventListener("click", closePop);
document.addEventListener("keydown", e => {
  if (!popOpen()) return;
  if (e.key === "Escape") { e.preventDefault(); closePop(); return; }
  if (e.key === "Tab") { // odak pop-up içinde kalsın
    const f = [...$("pop").querySelectorAll("button,[href],[tabindex]:not([tabindex='-1'])")].filter(el => el.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
$("popClose").addEventListener("click", closePop);
$("popClose2").addEventListener("click", closePop);
$("popPrev").addEventListener("click", () => openPop(P[(popIdx - 1 + N) % N].id));
$("popNext").addEventListener("click", () => openPop(P[(popIdx + 1) % N].id));
document.addEventListener("click", e => { const b = e.target.closest("[data-open]"); if (b) openPop(b.dataset.open); });

// Telefonda başlıktan aşağı çekerek kapatma
(function(){
  const hd = $("popHd"), dlg = $("pop");
  let y0 = null, dy = 0;
  hd.addEventListener("pointerdown", e => { if (e.pointerType === "mouse" || e.target.closest("button")) return; y0 = e.clientY; dy = 0; dlg.style.transition = "none"; hd.setPointerCapture(e.pointerId); });
  hd.addEventListener("pointermove", e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); dlg.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 === null) return; y0 = null; dlg.style.transition = "transform .3s cubic-bezier(.22,.7,.18,1)";
    if (dy > 110){ closePop(); setTimeout(() => { dlg.style.transform = ""; dlg.style.transition = ""; }, 50); }
    else dlg.style.transform = ""; };
  hd.addEventListener("pointerup", end); hd.addEventListener("pointercancel", end);
})();

$("film").innerHTML = "<span></span>".repeat(90);
initCarousel();
requestAnimationFrame(t => { lastTick = t; tick(t); });
const h = (location.hash || "").slice(1);
if (P.some(p => p.id === h)) openPop(h);
